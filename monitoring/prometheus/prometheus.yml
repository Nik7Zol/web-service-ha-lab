global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - "/etc/prometheus/alert-rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter-monitoring'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor-monitoring'
    static_configs:
      - targets: ['cadvisor:8080']

  # Метрики с App-сервера (192.168.1.2)
  - job_name: 'node-exporter-app'
    static_configs:
      - targets: ['192.168.1.2:9100']

  - job_name: 'cadvisor-app'
    static_configs:
      - targets: ['192.168.1.2:8080']

  # Проверка /health приложения через blackbox
  - job_name: 'blackbox-health'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://192.168.1.2/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
